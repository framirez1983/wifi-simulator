server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the (~120 KB) HTML/JS payload
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Single-page app: always fall back to the one file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't aggressively cache the app file so updates show up after a rebuild
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Stage 7A.1 worker assets.
    #
    # These MUST NOT fall through to the single-page-app fallback. With the
    # generic `try_files ... /index.html` rule, a missing rt3d-worker.js is
    # answered with HTTP 200 and the HTML of the app, which the browser then
    # tries to parse as JavaScript. The failure surfaces as an obscure syntax
    # error inside the worker instead of an honest 404, which is exactly the
    # class of invisible breakage Stage 7A is meant to eliminate.
    location = /rt3d-core.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /rt3d-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
