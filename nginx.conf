server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the (~120 KB) HTML/JS payload
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Single-page app: always fall back to the one file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't aggressively cache the app file so updates show up after a rebuild
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
